[project]
name = "kyro-backend"
version = "0.1.0"
description = "Local-first software security and engineering intelligence"
requires-python = ">=3.12,<3.14"
# 0.26.0 corrupts memory through Point.row/column getters (upstream issues #472/#505).
dependencies = ["fastapi>=0.121", "uvicorn[standard]>=0.38", "sqlalchemy>=2.0.44", "alembic>=1.17", "pydantic-settings>=2.11", "httpx>=0.28", "argon2-cffi>=25.1", "cryptography>=46", "pyjwt>=2.10", "psycopg[binary]>=3.2", "tree-sitter==0.25.2", "tree-sitter-python>=0.25", "tree-sitter-javascript>=0.25", "tree-sitter-typescript>=0.23", "packaging>=25"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-cov>=7", "ruff>=0.14", "mypy>=1.18"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
