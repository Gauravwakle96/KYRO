services:
  kyro:
    build:
      context: .
      dockerfile: infrastructure/docker/App.Dockerfile
    image: kyro:local
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      KYRO_DATA_DIR: /data
      KYRO_DATABASE_URL: ${KYRO_DEPLOY_DATABASE_URL:-sqlite:////data/kyro.db}
      KYRO_WORKSPACE_VOLUME: kyro-data
      KYRO_LOCAL_MODEL_URL: ${KYRO_DEPLOY_LOCAL_MODEL_URL:-http://host.docker.internal:8080/v1}
      KYRO_LOCAL_MODEL: ${KYRO_LOCAL_MODEL:-qwen3-8b}
      KYRO_ALLOWED_ORIGINS: http://127.0.0.1:8787,http://localhost:8787
      KYRO_ALLOWED_HOSTS: localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kyro-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

volumes:
  kyro-data:
    name: kyro-data
