name: KYRO checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check app migrations
        working-directory: backend
      - run: uv run mypy app
        working-directory: backend
      - run: uv run pytest --junitxml=../backend-tests.xml
        working-directory: backend
      - run: uvx pip-audit -r requirements.txt
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests
          path: backend-tests.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm audit
      - run: npm run build
