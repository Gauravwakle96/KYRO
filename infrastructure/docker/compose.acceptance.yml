# Used only for a fresh local deployment acceptance run. Existing data is preserved.
services:
  kyro:
    ports: !override
      - "127.0.0.1:8789:8787"
    environment:
      KYRO_WORKSPACE_VOLUME: kyro-clean-acceptance
      KYRO_ALLOWED_ORIGINS: http://127.0.0.1:8789,http://localhost:8789
      KYRO_GITHUB_TOKEN: ""
      KYRO_GITHUB_APP_ID: ""
      KYRO_GITHUB_INSTALLATION_ID: ""
      KYRO_GITHUB_CLIENT_ID: ""
      KYRO_CLOUD_AUTHORIZED: "false"
      KYRO_LOCAL_ONLY: "true"
volumes:
  kyro-data:
    name: kyro-clean-acceptance
